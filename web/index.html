<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperSheet - Enterprise Scale Sheet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
          'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: #f7f8fa;
        color: #1f2937;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100vh;
      }

      .supersheet-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #f7f8fa;
      }

      .header {
        background: white;
        border-bottom: 1px solid #e4e7ec;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-title {
        font-size: 18px;
        font-weight: 600;
        color: #1f2937;
      }

      .header-badge {
        background: #0f766e;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-left: 8px;
      }

      .header-info {
        font-size: 13px;
        color: #667085;
      }

      .toolbar {
        background: white;
        border-bottom: 1px solid #e4e7ec;
        padding: 8px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .toolbar input {
        padding: 6px 12px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 13px;
      }

      .toolbar button {
        padding: 6px 12px;
        border: 1px solid #d1d5db;
        background: white;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        color: #1f2937;
      }

      .toolbar button:hover {
        background: #f3f4f6;
      }

      .content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .grid-container {
        flex: 1;
        overflow: hidden;
      }

      .status-bar {
        background: white;
        border-top: 1px solid #e4e7ec;
        padding: 8px 16px;
        font-size: 12px;
        color: #667085;
        display: flex;
        justify-content: space-between;
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 14px;
        color: #667085;
      }

      .error {
        padding: 16px;
        background: #fee2e2;
        border-left: 4px solid #dc2626;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
